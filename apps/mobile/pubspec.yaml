name: clearbreath
description: Pranayama and breathing exercise platform.
publish_to: 'none'
version: 0.0.2+152

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.2.1
  flutter_svg: ^2.0.10
  go_router: ^17.1.0
  drift: ^2.31.0
  dio: ^5.9.1
  flutter_secure_storage: ^10.0.0
  just_audio: ^0.10.5
  path: ^1.9.1
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ">=0.5.0 <0.6.0"
  vibration: ^3.1.7
  wakelock_plus: ^1.4.0
  uuid: ^4.5.3
  audio_session: ^0.2.2
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.18
  cupertino_icons: ^1.0.8
  flutter_markdown: ^0.7.7+1
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.0
  sign_in_with_apple: ^7.0.1
  google_sign_in: ^7.2.0
  device_info_plus: ^12.3.0
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_timezone: ^5.0.1
  share_plus: ^12.0.1
  shared_preferences: ^2.5.3
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  drift_dev: ^2.31.0
  build_runner: ^2.11.1
  sqlite3: ^2.9.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/clearbreath_logo.svg
    - assets/branding/google_g.svg
    - assets/audio/
    - assets/techniques/
    - assets/recommendations/
    - assets/legal/
    - assets/images/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 21
