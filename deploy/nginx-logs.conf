# Rate limiting for dashboard login: 1 request/sec per IP
limit_req_zone $binary_remote_addr zone=dashboard_login:10m rate=1r/s;

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name logs.clearbreath.life;

    # Allow certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name logs.clearbreath.life;

    # ── SSL (certbot will populate these) ──
    ssl_certificate     /etc/letsencrypt/live/logs.clearbreath.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logs.clearbreath.life/privkey.pem;

    # ── SSL hardening ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # ── HSTS ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ── Security headers ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Request size limit ──
    client_max_body_size 1m;

    # ── Logging ──
    access_log /var/log/nginx/logs.clearbreath.life.access.log;
    error_log  /var/log/nginx/logs.clearbreath.life.error.log;

    # ── Login endpoint (strict rate limit) ──
    location = /dashboard/login {
        limit_req zone=dashboard_login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://clearbreath_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }

    # ── SSE endpoint (long-lived connections, no buffering) ──
    location /dashboard/sse/ {
        proxy_pass http://clearbreath_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── All other dashboard routes ──
    location /dashboard/ {
        proxy_pass http://clearbreath_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }

    # ── Root redirects to dashboard ──
    location = / {
        return 301 /dashboard/;
    }

    # ── Block dot paths ──
    location ~ /\. {
        deny all;
    }
}
