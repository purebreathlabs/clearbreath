# Rate limiting zone: 10 requests/sec per IP for general API
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;

# Stricter zone for auth endpoints: 2 requests/sec per IP
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=2r/s;

upstream clearbreath_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.clearbreath.life;

    # Allow certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.clearbreath.life;

    # ── SSL (certbot will populate these) ──
    ssl_certificate     /etc/letsencrypt/live/api.clearbreath.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.clearbreath.life/privkey.pem;

    # ── SSL hardening ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # ── HSTS ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ── Security headers ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Request size limit ──
    client_max_body_size 1m;

    # ── Logging ──
    access_log /var/log/nginx/api.clearbreath.life.access.log;
    error_log  /var/log/nginx/api.clearbreath.life.error.log;

    # ── Health check (no rate limit) ──
    location = /health {
        proxy_pass http://clearbreath_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location = /ready {
        proxy_pass http://clearbreath_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ── Auth endpoints (stricter rate limit) ──
    location /v1/auth/ {
        limit_req zone=api_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://clearbreath_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }

    # ── All other API routes ──
    location / {
        limit_req zone=api_general burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://clearbreath_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    10s;
        proxy_read_timeout    30s;
    }

    # ── Block common attack paths ──
    location ~ /\. {
        deny all;
    }
}
