name: Mobile CI

on:
  push:
    branches: [main]
    paths: [apps/mobile/**]
  pull_request:
    paths: [apps/mobile/**]

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Format check
        run: dart format --set-exit-if-changed --output=none lib/

      - name: Test
        run: flutter test
