name: Server CI

on:
  push:
    branches: [main]
    paths: [server/**]
  pull_request:
    paths: [server/**]

jobs:
  ci:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          make server-lint

      - name: Format check
        run: make server-fmt-check

      - name: Build
        run: make server-build

      - name: Test
        run: make server-test-ci

  integration:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: clearbreath
          POSTGRES_USER: clearbreath
          POSTGRES_PASSWORD: clearbreath
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U clearbreath -d clearbreath"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Integration test
        env:
          ENV: development
          DATABASE_URL: postgres://clearbreath:clearbreath@localhost:5433/clearbreath?sslmode=disable
          REDIS_ADDR: localhost:6380
          REDIS_PASSWORD: ""
          JWT_ACCESS_SECRET: dev_access_secret_change_me_01234567890123456789012
          JWT_REFRESH_SECRET: dev_refresh_secret_change_me_0123456789012345678901
          DEV_AUTH_ENABLED: "true"
          DEV_AUTH_SECRET: dev_secret_change_me
        run: make server-test-integration

  deploy:
    if: github.event_name == 'push'
    needs: [ci, integration]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to production
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "bash /home/rahul/production/clearbreath/deploy/cd-deploy.sh"
