name: Mobile Release

on:
  workflow_run:
    workflows: ["Mobile CI"]
    types: [completed]
    branches: [main]

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          BUILD=$(git rev-list --count HEAD)
          echo "APP_VERSION=${VERSION}+${BUILD}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: make FLUTTER=flutter mobile-get

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > apps/mobile/android/app/clearbreath-release.keystore
          PROPS=apps/mobile/android/app/key.properties
          echo "storePassword=$KEYSTORE_PASSWORD" > "$PROPS"
          echo "keyPassword=$KEY_PASSWORD" >> "$PROPS"
          echo "keyAlias=$KEY_ALIAS" >> "$PROPS"
          echo "storeFile=clearbreath-release.keystore" >> "$PROPS"

      - name: Build arm64-v8a release APK
        run: make FLUTTER=flutter apk-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clearbreath-${{ env.APP_VERSION }}-arm64-v8a
          path: apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 90
