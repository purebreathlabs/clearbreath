name: Mobile Release

on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: ["Mobile CI"]
    types: [completed]
    branches: [main]

jobs:
  build:
    if: >-
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          BUILD=$(git rev-list --count HEAD)
          echo "APP_VERSION=${VERSION}+${BUILD}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: make FLUTTER=flutter mobile-get

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > apps/mobile/android/app/clearbreath-release.keystore
          PROPS=apps/mobile/android/app/key.properties
          echo "storePassword=$KEYSTORE_PASSWORD" > "$PROPS"
          echo "keyPassword=$KEY_PASSWORD" >> "$PROPS"
          echo "keyAlias=$KEY_ALIAS" >> "$PROPS"
          echo "storeFile=clearbreath-release.keystore" >> "$PROPS"

      - name: Build arm64-v8a release APK
        run: make FLUTTER=flutter apk-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clearbreath-${{ env.APP_VERSION }}-arm64-v8a
          path: apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 90

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          APK=apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          mv "$APK" "clearbreath-${TAG}-arm64-v8a.apk"
          gh release create "$TAG" \
            "clearbreath-${TAG}-arm64-v8a.apk#ClearBreath ${TAG} (arm64-v8a)" \
            --title "ClearBreath ${TAG}" \
            --generate-notes
