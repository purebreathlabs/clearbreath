name: Feature request
description: Suggest an improvement for the mobile app, server API, or landing page.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea.
        Please explain the problem and the change you want to see.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
      placeholder: I am frustrated when ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the change you want.
      placeholder: I would like ClearBreath to ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider?
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Mobile App
        - Server API
        - Landing Page
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      placeholder: Links, mockups, examples, or anything else that helps.
    validations:
      required: false
