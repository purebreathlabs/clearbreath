name: Bug report
description: Report a reproducible problem in the mobile app, server API, or landing page.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        Please share enough detail for us to reproduce the issue.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: A clear and concise summary of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that reproduce the issue.
      placeholder: |
        1. Go to ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Mobile App
        - Server API
        - Landing Page
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Device and OS info
      description: Include platform, OS version, browser, and app version where relevant.
      placeholder: Pixel 8 / Android 16, iPhone 15 / iOS 19, macOS 15 / Chrome 135
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Add screenshots, screen recordings, or logs if they help explain the issue.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      placeholder: Anything else we should know?
    validations:
      required: false
