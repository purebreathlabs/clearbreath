{{define "login.html"}}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ClearBreath Logs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-sm">
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-8 shadow-2xl">
            <div class="text-center mb-8">
                <h1 class="text-lg font-bold tracking-tight">ClearBreath<span class="text-blue-400 ml-1">Logs</span></h1>
                <p class="text-xs text-zinc-500 mt-1">Log Dashboard</p>
            </div>

            {{if .Error}}
            <div class="mb-4 px-3 py-2 bg-red-500/10 border border-red-500/20 rounded-lg text-xs text-red-400">
                {{.Error}}
            </div>
            {{end}}

            <form method="POST" action="/dashboard/login" class="space-y-4">
                <div>
                    <label for="username" class="block text-xs text-zinc-400 mb-1.5">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username"
                        class="w-full px-3 py-2 bg-zinc-800 border border-zinc-700 rounded-lg text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500">
                </div>
                <div>
                    <label for="password" class="block text-xs text-zinc-400 mb-1.5">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                        class="w-full px-3 py-2 bg-zinc-800 border border-zinc-700 rounded-lg text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500">
                </div>
                <button type="submit"
                    class="w-full px-3 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500/50">
                    Sign In
                </button>
            </form>
        </div>
        <p class="text-center text-xs text-zinc-600 mt-4">Unauthorized access is prohibited.</p>
    </div>
</body>
</html>
{{end}}
